services:

  mysql:
    image: mysql:8.4
    container_name: todo-summary-mysql-compose
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo-network

  backend:
    image: todo-summary-backend:latest
    container_name: todo-summary-backend-compose
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - todo-network

  frontend:
    image: todo-summary-frontend:latest
    container_name: todo-summary-frontend-compose
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"
    networks:
      - todo-network

  prometheus:
    image: prom/prometheus:latest
    container_name: todo-summary-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - todo-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: todo-summary-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - todo-network
    depends_on:
      - prometheus

networks:
  todo-network:

volumes:
  mysql_data:
  grafana_data: